version: "3.9"

services:
  app:
    build: .
    image: invoice-extractor-api:1.1.0
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
